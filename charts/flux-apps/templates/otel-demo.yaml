apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: {{ .Release.Namespace }}
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-demo
  namespace: {{ .Release.Namespace }}
spec:
  interval: 10m
  releaseName: otel-demo
  targetNamespace: otel-demo
  # Don't start the demo until the groundcover sensor (its OTLP endpoint) is Ready
  dependsOn:
    - name: groundcover
  chart:
    spec:
      chart: opentelemetry-demo
      version: {{ required "otelDemo.chartVersion is required" .Values.otelDemo.chartVersion | quote }}
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    {{- toYaml .Values.otelDemo.values | nindent 4 }}
