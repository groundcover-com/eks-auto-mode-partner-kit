default:
  envOverrides:
    - name: OTEL_COLLECTOR_NAME
      value: groundcover-sensor.groundcover.svc.cluster.local

opentelemetry-collector:
  enabled: false

otel-ebpf-profiler:
  enabled: true
  # EKS Auto Mode packs nodes before this DaemonSet exists and never adds
  # capacity for DaemonSet pods, so without a high priority some profiler pods
  # stay Pending. This lets them evict a regular pod, which reschedules elsewhere.
  priorityClassName: system-node-critical
  presets:
    kubernetesAttributes:
      enabled: true          # RBAC + K8S_NODE_NAME env only; processor is defined below
  alternateConfig:
    processors:
      k8s_attributes:
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: container.id
        extract:
          otel_annotations: true
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - container.image.name
            - container.image.tag
    exporters:
      otlp_grpc/collector:
        endpoint: groundcover-sensor.groundcover.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        profiles:
          receivers: [profiling]
          processors: [k8s_attributes, transform/set_service_name]
          exporters: [otlp_grpc/collector]

jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

opensearch:
  enabled: false
